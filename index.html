<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Budget Tracker</h1>
            <div class="month-selector">
                <button id="prevMonth" class="month-btn">←</button>
                <h2 id="currentMonth"></h2>
                <button id="nextMonth" class="month-btn">→</button>
            </div>
        </header>

        <div class="summary-cards">
            <div class="card income-card">
                <h3>Monthly Income</h3>
                <p class="amount" id="totalIncome">$0.00</p>
            </div>
            <div class="card expense-card">
                <h3>Total Expenses</h3>
                <p class="amount" id="totalExpenses">$0.00</p>
            </div>
            <div class="card balance-card">
                <h3>Remaining</h3>
                <p class="amount" id="remaining">$0.00</p>
            </div>
        </div>

        <div class="main-content">
            <div class="left-panel">
                <div class="section">
                    <h3>💵 Set Monthly Income</h3>
                    <div class="input-group">
                        <input type="number" id="incomeAmount" placeholder="Enter amount" step="0.01">
                        <button id="setIncome" class="btn-primary">Set Income</button>
                    </div>
                </div>

                <div class="section">
                    <h3>➕ Add Expense</h3>
                    <div class="input-group">
                        <input type="text" id="expenseName" placeholder="Expense name">
                        <input type="number" id="expenseAmount" placeholder="Amount" step="0.01">
                        <select id="expenseCategory">
                            <option value="Housing">🏠 Housing</option>
                            <option value="Food">🍔 Food</option>
                            <option value="Transportation">🚗 Transportation</option>
                            <option value="Utilities">💡 Utilities</option>
                            <option value="Entertainment">🎮 Entertainment</option>
                            <option value="Healthcare">🏥 Healthcare</option>
                            <option value="Shopping">🛍️ Shopping</option>
                            <option value="Other">📦 Other</option>
                        </select>
                        <button id="addExpense" class="btn-primary">Add Expense</button>
                    </div>
                </div>

                <div class="section">
                    <h3>📋 Expenses List</h3>
                    <div id="expensesList"></div>
                </div>
            </div>

            <div class="right-panel">
                <div class="chart-container">
                    <h3>Expenses by Category</h3>
                    <canvas id="pieChart"></canvas>
                </div>
                <div class="chart-container">
                    <h3>Category Breakdown</h3>
                    <canvas id="barChart"></canvas>
                </div>
            </div>
        </div>

        <div class="actions">
            <button id="exportData" class="btn-secondary">📥 Export Data</button>
            <button id="importData" class="btn-secondary">📤 Import Data</button>
            <button id="clearMonth" class="btn-danger">🗑️ Clear This Month</button>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".json" style="display: none;">

    <script src="script.js"></script>
</body>
</html>
