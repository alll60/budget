<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>&#128176; Budget Tracker</h1>

            <div class="view-toggle">
                <button id="viewMonthly" class="toggle-btn active">Monthly</button>
                <button id="viewYearly" class="toggle-btn">Yearly</button>
            </div>

            <div class="month-selector">
                <button id="prevPeriod" class="month-btn">&larr;</button>
                <h2 id="currentPeriod"></h2>
                <button id="nextPeriod" class="month-btn">&rarr;</button>
            </div>
        </header>

        <div class="hero-banner"><img src="banner.webp" alt="Budget Tracker"></div>

        <div class="summary-cards">
            <div class="card income-card">
                <h3 id="incomeLabel">Monthly Income</h3>
                <p class="amount" id="totalIncome">$0.00</p>
            </div>
            <div class="card expense-card">
                <h3>Total Expenses</h3>
                <p class="amount" id="totalExpenses">$0.00</p>
            </div>
            <div class="card balance-card">
                <h3>Remaining</h3>
                <p class="amount" id="remaining">$0.00</p>
            </div>
        </div>

        <div class="main-content">
            <div class="left-panel">
                <div class="section" id="incomeSection">
                    <h3>&#128181; Set Monthly Income</h3>
                    <div class="input-group">
                        <input type="number" id="incomeAmount" placeholder="Enter amount" step="0.01">
                        <button id="setIncome" class="btn-primary">Set Income</button>
                    </div>
                </div>

                <div class="section" id="expenseSection">
                    <h3>&#10133; Add Expense</h3>
                    <div class="input-group">
                        <input type="text" id="expenseName" placeholder="Expense name">
                        <input type="number" id="expenseAmount" placeholder="Amount" step="0.01">
                        <input type="month" id="expenseMonth" title="Expense month">
                        <select id="expenseCategory">
                            <option value="Housing">Housing</option>
                            <option value="Food">Food</option>
                            <option value="Transportation">Transportation</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Other">Other</option>
                        </select>
                        <select id="expenseFrequency">
                            <option value="once">One-time</option>
                            <option value="monthly">&#128260; Monthly (recurring)</option>
                            <option value="annual">&#128197; Annual (recurring)</option>
                        </select>
                        <button id="addExpense" class="btn-primary">Add Expense</button>
                    </div>
                </div>

                <div class="section">
                    <h3 id="listTitle">&#128203; Expenses List</h3>
                    <div id="expensesList"></div>
                </div>
            </div>

            <div class="right-panel">
                <div class="chart-container">
                    <h3>Expenses by Category</h3>
                    <canvas id="pieChart"></canvas>
                </div>
                <div class="chart-container">
                    <h3 id="barTitle">Category Breakdown</h3>
                    <canvas id="barChart"></canvas>
                </div>
            </div>
        </div>

        <div class="actions">
            <button id="exportCSV" class="btn-secondary">&#128202; Export CSV</button>
            <button id="exportPDF" class="btn-secondary">&#128196; Export PDF</button>
            <button id="exportData" class="btn-secondary">&#128229; Backup JSON</button>
            <button id="importData" class="btn-secondary">&#128228; Import JSON / CSV</button>
            <button id="clearMonth" class="btn-danger">&#128465; Clear this period</button>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".json,.csv" style="display: none;">

    <script src="script.js"></script>
</body>
</html>
